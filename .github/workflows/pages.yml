name: Publicar el conversor en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversor-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: vars.SUPABASE_PUBLISHABLE_KEY != ''
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xvjscltcvanrwqmgfcey.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
