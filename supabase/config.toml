project_id = "conversor-pe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
additional_redirect_urls = ["http://127.0.0.1:8000/"]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[functions.conversor-api]
# The handler validates each user token with Supabase Auth before reading data
# or using its server credential. It also accepts browser preflight requests.
verify_jwt = false
